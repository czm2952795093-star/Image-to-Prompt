<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image → GPT Image Prompt 设置</title>
  <style>
    body { font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 20px; color: #222; }
    h1 { font-size: 18px; }
    label { display: block; font-weight: 600; margin: 18px 0 6px; }
    input { width: 100%; padding: 9px 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 13px; }
    .hint { color: #666; font-size: 12px; margin-top: 6px; }
    .row { display: flex; gap: 12px; }
    .row > div { flex: 1; }
    button { margin-top: 22px; padding: 9px 18px; background: #4f7cff; color: #fff; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
    #status { margin-left: 12px; color: #2a9d4a; font-size: 13px; }
    code, a { color: #4f7cff; }
    code { background: #f2f2f4; padding: 1px 5px; border-radius: 4px; }
    .note { background: #f7f8fa; border: 1px solid #e6e8ec; border-radius: 8px; padding: 12px 14px; font-size: 12px; color: #555; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>Image → GPT Image Prompt 设置</h1>
  <p>右键任意图片 → <b>转换为 GPT Image 提示词</b>。识别用你自己的 API Key，密钥只存在你的浏览器本地，不上传任何第三方服务器。</p>

  <label for="apiKey">API Key（必填）</label>
  <input id="apiKey" type="password" placeholder="sk-..." autocomplete="off" />
  <div class="hint">支持 <a href="https://aihubmix.com" target="_blank">AiHubMix</a> 或任意 OpenAI 兼容网关的 Key。</div>

  <div class="row">
    <div>
      <label for="visionModel">视觉模型</label>
      <input id="visionModel" type="text" placeholder="gpt-5.5" />
      <div class="hint">默认 <code>gpt-5.5</code>，可换 claude-opus-4-8、gemini-3.1-pro 等。</div>
    </div>
    <div>
      <label for="apiBaseUrl">API 地址</label>
      <input id="apiBaseUrl" type="url" placeholder="https://aihubmix.com/v1" />
      <div class="hint">OpenAI 官方填 <code>https://api.openai.com/v1</code>。</div>
    </div>
  </div>

  <button id="save">保存</button>
  <span id="status"></span>

  <div class="note">
    🔒 Key 用 <code>chrome.storage.local</code> 存储，仅保存在本机、不会同步、不会发往除你所填 API 地址以外的任何地方。
  </div>

  <script src="options.js"></script>
</body>
</html>
